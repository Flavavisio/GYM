<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GYM Control · Clientes</title><link rel="stylesheet" href="assets/css/app.css"><link rel="icon" href="assets/gym-control.svg" type="image/svg+xml"></head>
<body><button class="btn light" onclick="GYM_SESSION.logout()" style="position:fixed;right:16px;bottom:16px;z-index:50">Sair</button><div class="layout"><aside class="sidebar"><div class="brand">GYM CONTROL</div><nav class="nav"><a href="admin.html">Dashboard</a><a class="active" href="clients.html">Clientes</a><a href="crm.html">CRM / Leads</a><a href="enrollment.html">Nova inscrição</a><a href="reception.html">Receção / Kiosk</a><a href="hikvision.html">Hikvision / Acessos</a><a href="reports.html">Relatórios</a><a href="client-portal.html">Portal Cliente</a></nav></aside>
<main class="main"><div class="topbar"><div><h1 style="margin:0">Clientes</h1><div class="muted">Ficha 360º de cada membro</div></div><a class="btn primary" href="enrollment.html">Nova inscrição</a></div>
<div class="client-layout"><aside><div class="card"><input id="clientSearch" placeholder="Pesquisar cliente..."><div id="clientList" class="client-list" style="margin-top:12px"></div></div></aside>
<section><div class="card"><div class="profile-head"><div class="profile-avatar" id="profileAvatar">JS</div><div><h2 id="profileName" style="margin:0"></h2><div class="muted" id="profileMeta"></div><div style="margin-top:8px" id="profileBadges"></div></div><div class="toolbar"><button class="btn light" id="changePlan">Mudar plano</button><button class="btn light" id="freezeClient">Congelar</button><button class="btn danger" id="cancelClient">Cancelar</button><button class="btn success" id="reactivateClient">Reativar</button></div></div>
<div class="profile-tabs"><button class="profile-tab active" data-tab="overview">Resumo</button><button class="profile-tab" data-tab="finance">Financeiro</button><button class="profile-tab" data-tab="access">Acessos</button><button class="profile-tab" data-tab="activities">Aulas / PT</button><button class="profile-tab" data-tab="measurements">Avaliações</button><button class="profile-tab" data-tab="documents">Documentos</button><button class="profile-tab" data-tab="notes">Notas</button></div>
<div class="profile-panel active" data-panel="overview" id="overviewPanel"></div><div class="profile-panel" data-panel="finance" id="financePanel"></div><div class="profile-panel" data-panel="access" id="accessPanel"></div><div class="profile-panel" data-panel="activities" id="activitiesPanel"></div><div class="profile-panel" data-panel="measurements" id="measurementsPanel"></div><div class="profile-panel" data-panel="documents" id="documentsPanel"></div><div class="profile-panel" data-panel="notes" id="notesPanel"></div>
</div></section></div></main></div>

<div class="modal hidden" id="planModal"><div class="modal-box"><div class="space"><h2>Mudar plano</h2><button class="btn light" id="closePlan">Fechar</button></div><label>Novo plano</label><select id="planSelect"></select><div style="margin-top:14px;text-align:right"><button class="btn primary" id="savePlan">Guardar alteração</button></div></div></div>
<div class="modal hidden" id="freezeModal"><div class="modal-box"><div class="space"><h2>Congelar adesão</h2><button class="btn light" id="closeFreeze">Fechar</button></div><div class="row"><div><label>De</label><input id="freezeFrom" type="date"></div><div><label>Até</label><input id="freezeTo" type="date"></div></div><div style="margin-top:10px"><label>Motivo</label><input id="freezeReason"></div><div style="margin-top:14px;text-align:right"><button class="btn primary" id="saveFreeze">Confirmar congelamento</button></div></div></div>
<div class="modal hidden" id="measurementModal"><div class="modal-box"><div class="space"><h2>Nova avaliação</h2><button class="btn light" id="closeMeasurement">Fechar</button></div><div class="row"><div><label>Data</label><input id="mDate" type="date"></div><div><label>Peso kg</label><input id="mWeight" type="number" step="0.1"></div></div><div class="row" style="margin-top:10px"><div><label>Gordura %</label><input id="mFat" type="number" step="0.1"></div><div><label>Músculo kg</label><input id="mMuscle" type="number" step="0.1"></div></div><div style="margin-top:10px"><label>Cintura cm</label><input id="mWaist" type="number" step="0.1"></div><div style="margin-top:14px;text-align:right"><button class="btn primary" id="saveMeasurement">Guardar avaliação</button></div></div></div>
<script src="assets/js/app.js"></script><script src="assets/js/clients.js"></script><script src="assets/js/session.js"></script><script src="assets/js/ui.js"></script></body></html>
